<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="RUJUMENTO — jumento com caixa e baquetas">
  <title>RUJUMENTO</title>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="#171a21"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#252a35" stroke-width="4"/>

  <!-- ================= JUMENTO (ao fundo) ================= -->
  <g fill="#454d5e">
    <!-- orelhas -->
    <ellipse cx="198" cy="132" rx="27" ry="68" transform="rotate(-20 198 132)"/>
    <ellipse cx="314" cy="132" rx="27" ry="68" transform="rotate(20 314 132)"/>
  </g>
  <g fill="#2e3542">
    <ellipse cx="198" cy="136" rx="13" ry="46" transform="rotate(-20 198 136)"/>
    <ellipse cx="314" cy="136" rx="13" ry="46" transform="rotate(20 314 136)"/>
  </g>

  <!-- cabeça -->
  <path fill="#454d5e"
        d="M 196 200 C 190 160 322 160 316 200 L 322 270
           C 330 336 302 378 256 378 C 210 378 182 336 190 270 Z"/>

  <!-- crina -->
  <g stroke="#333b49" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 232 176 L 226 200"/>
    <path d="M 256 170 L 256 196"/>
    <path d="M 280 176 L 286 200"/>
  </g>

  <!-- focinho -->
  <ellipse cx="256" cy="330" rx="56" ry="42" fill="#596275"/>
  <ellipse cx="236" cy="330" rx="7" ry="11" fill="#252a35"/>
  <ellipse cx="276" cy="330" rx="7" ry="11" fill="#252a35"/>

  <!-- olhos -->
  <ellipse cx="220" cy="248" rx="12" ry="14" fill="#12141a"/>
  <ellipse cx="292" cy="248" rx="12" ry="14" fill="#12141a"/>
  <circle cx="224" cy="243" r="4" fill="#e8eaf0" opacity=".85"/>
  <circle cx="296" cy="243" r="4" fill="#e8eaf0" opacity=".85"/>

  <!-- ================= BAQUETAS (cruzadas, atrás da caixa) ================= -->
  <g>
    <g transform="rotate(32 256 400)">
      <rect x="246" y="178" width="20" height="292" rx="10" fill="#d9a066"/>
      <ellipse cx="256" cy="186" rx="14" ry="17" fill="#e8b884"/>
    </g>
    <g transform="rotate(-32 256 400)">
      <rect x="246" y="178" width="20" height="292" rx="10" fill="#c98f56"/>
      <ellipse cx="256" cy="186" rx="14" ry="17" fill="#dcaa77"/>
    </g>
  </g>

  <!-- ================= CAIXA (à frente) ================= -->
  <!-- casco -->
  <path d="M 106 368 L 106 448 Q 256 480 406 448 L 406 368 Z" fill="#dfe3ec"/>
  <!-- tirantes -->
  <g fill="#aab2c2">
    <rect x="146" y="374" width="9" height="80" rx="4"/>
    <rect x="200" y="376" width="9" height="86" rx="4"/>
    <rect x="252" y="377" width="9" height="88" rx="4"/>
    <rect x="304" y="376" width="9" height="86" rx="4"/>
    <rect x="358" y="374" width="9" height="80" rx="4"/>
  </g>
  <!-- aro de baixo -->
  <path d="M 106 442 Q 256 474 406 442" fill="none" stroke="#ff8c42" stroke-width="13" stroke-linecap="round"/>
  <!-- pele -->
  <ellipse cx="256" cy="368" rx="150" ry="34" fill="#f4f6fa"/>
  <!-- aro de cima -->
  <ellipse cx="256" cy="368" rx="150" ry="34" fill="none" stroke="#ff8c42" stroke-width="13"/>
</svg>
